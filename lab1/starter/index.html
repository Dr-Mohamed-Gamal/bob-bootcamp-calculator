<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--
        STEP 2 — Build HTML & CSS (Code mode)
        ======================================
        Your task: build the calculator structure here.

        Use CODE MODE in Bob with this prompt:
        "Create index.html and styles.css for a dark-theme calculator.
         Use a 4-column CSS Grid, data-* attributes on every button,
         .btn-equals and .btn-zero spanning 2 columns, orange operators,
         gray function buttons, and the 1px gap divider trick."

        Structure needed:
        ┌─ div.calculator
        │   ├─ div.display
        │   │   ├─ div#previous-operand   (e.g. "5 +")
        │   │   └─ div#current-operand    (default: "0")
        │   └─ div.buttons
        │       ├─ button[data-action="clear"]      AC
        │       ├─ button[data-action="delete"]     DEL
        │       ├─ button[data-action="percent"]    %
        │       ├─ button[data-operator="/"]        ÷
        │       ├─ button[data-number="7"]          7
        │       │   ... (7 8 9 × / 4 5 6 − / 1 2 3 +)
        │       ├─ button[data-number="0"]  .btn-zero  (spans 2 cols)
        │       ├─ button[data-number="."]            .
        │       └─ button[data-action="equals"] .btn-equals (spans 2 cols)
    -->

    <script src="script.js"></script>
</body>
</html>
